server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: eventease-seat-booking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventbooking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 15000
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

app:
  jwt:
    # Override JWT_SECRET in environment variables for production
    secret: ${JWT_SECRET:EventEaseLocalDevJwtSecretKey2026CardinalityAssessmentSecureKey64Bytes!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  seed:
    enabled: ${SEED_ENABLED:true}
  scheduler:
    hold-cleanup-ms: ${HOLD_CLEANUP_MS:15000}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
