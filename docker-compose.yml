version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventease-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventbooking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - eventease_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventbooking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eventease_pgdata:
